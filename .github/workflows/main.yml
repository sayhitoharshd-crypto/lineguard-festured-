
name: Build LineGuard Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "artifacts/lineguard/**"
      - "lib/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: lineguard-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build Standalone LineGuard APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # 1. Download project source
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Install pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # 3. Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # 4. Install Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 5. Find existing Android SDK tools
      # Do NOT use android-actions/setup-android@v3 here.
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME is not configured"
            exit 1
          fi

          echo "Android SDK: $ANDROID_HOME"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found"
            exit 1
          fi

          echo "Using: $SDKMANAGER"

          SDKMANAGER_DIR=$(dirname "$SDKMANAGER")

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      # 6. Accept Android SDK licenses
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses

      # 7. Install Android SDK
      - name: Install Android SDK packages
        shell: bash
        run: |
          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 8. Verify SDK installation
      - name: Verify Android SDK
        run: |
          "$SDKMANAGER" --version
          adb version
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      # 9. Install project dependencies
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      # 10. TypeScript validation
      - name: TypeScript check
        run: |
          pnpm --filter @workspace/lineguard run typecheck

      # 11. Generate standalone Android project
      - name: Expo Android prebuild
        working-directory: artifacts/lineguard
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: |
          pnpm exec expo prebuild \
            --platform android \
            --clean

      # 12. Verify Gradle wrapper
      - name: Verify Gradle wrapper
        working-directory: artifacts/lineguard/android
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew --version

      # 13. Build actual release APK
      - name: Build release APK
        working-directory: artifacts/lineguard/android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      # 14. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="artifacts/lineguard/android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "Release APK was not generated"
            exit 1
          fi

          echo "APK found successfully"

          AAPT=$(find "$ANDROID_HOME/build-tools" \
            -name aapt | sort -V | tail -n 1)

          if [ -z "$AAPT" ]; then
            echo "aapt not found"
            exit 1
          fi

          "$AAPT" dump badging "$APK" \
            | grep "package: name='com.lineguard.app'"

          unzip -l "$APK" \
            | grep -E 'assets/index.android.bundle'

          mkdir -p build-output

          cp "$APK" build-output/LineGuard-release.apk

          sha256sum build-output/LineGuard-release.apk \
            | tee build-output/SHA256SUMS.txt

          echo "APK verification completed"

      # 15. Upload APK and checksum
      - name: Upload LineGuard APK
        uses: actions/upload-artifact@v4
        with:
          name: LineGuard-Standalone-Release-APK
          path: |
            build-output/LineGuard-release.apk
            build-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          
