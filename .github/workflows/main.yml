
name: Build LineGuard Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm --filter @workspace/lineguard run typecheck

      - name: Generate Android project
        working-directory: artifacts/lineguard
        run: pnpm exec expo prebuild --platform android --clean

      - name: Build release APK
        working-directory: artifacts/lineguard/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LineGuard-Android-APK
          path: artifacts/lineguard/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          
