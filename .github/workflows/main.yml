
name: LineGuard Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build LineGuard Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract LineGuard source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="LineGuard-Extracted-GitHub-Root.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Source ZIP not found: $ZIP"
            exit 1
          fi

          echo "Extracting LineGuard project..."
          unzip -o "$ZIP" -x ".github/*" -d .

          echo "Checking extracted files..."
          ls -la
          ls -la artifacts/lineguard/

          test -f artifacts/lineguard/package.json

      - name: Check project structure
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json
          test -f pnpm-lock.yaml
          test -f pnpm-workspace.yaml
          test -f artifacts/lineguard/package.json
          test -f artifacts/api-server/package.json

          echo "Project structure verified."

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ERROR: ANDROID_HOME is not configured"
            exit 1
          fi

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager not found"
            exit 1
          fi

          echo "Using SDK manager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript check
        run: pnpm --filter @workspace/lineguard run typecheck

      - name: Expo prebuild
        working-directory: artifacts/lineguard
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: pnpm exec expo prebuild --platform android --clean

      - name: Verify Android project
        working-directory: artifacts/lineguard/android
        shell: bash
        run: |
          set -euo pipefail

          test -f gradlew

          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "ERROR: Android app Gradle file not found"
            exit 1
          fi

          chmod +x gradlew

      - name: Build release APK
        working-directory: artifacts/lineguard/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail

          APK="artifacts/lineguard/android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Release APK was not generated"
            exit 1
          fi

          mkdir -p build-output

          cp "$APK" build-output/LineGuard-release.apk

          sha256sum build-output/LineGuard-release.apk \
            > build-output/SHA256SUMS.txt

          echo "APK generated successfully:"
          ls -lh build-output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LineGuard-Release-APK
          path: build-output/
          if-no-files-found: error
          retention-days: 14
